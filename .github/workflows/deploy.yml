name: Deploy naar VPS

on:
  push:
    branches:
      - claude/rotterdam-property-scraper-impfg0
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          # ServerAlive-opties houden de SSH-sessie in leven tijdens een lange build;
          # anders viel de verbinding soms weg met "Broken pipe" (exit 255).
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -euo pipefail
            cd /opt/kamerverhuur-scanner/deploy
            # De fundazoeker/kansen-images bouwen vanaf een remote git-context. GitHub
            # staat onauthenticated fetches daarvan niet meer toe ("could not read
            # Username"). We authenticeren de build daarom met de workflow-eigen,
            # kortlevende GITHUB_TOKEN via een tijdelijke compose-override, zonder de
            # VPS-compose zelf aan te raken. De override wordt na afloop weer verwijderd.
            GH_TOKEN=${{ github.token }}
            CTX="https://x-access-token:${GH_TOKEN}@github.com/jmmreckman/kamerverhuur-scanner.git#claude/rotterdam-property-scraper-impfg0"
            {
              echo "services:"
              for s in fundazoeker kansen beschikbaarheid-check vergunningen-index; do
                echo "  ${s}:"
                echo "    build:"
                echo "      context: ${CTX}"
              done
            } > docker-compose.override.yml
            trap "rm -f docker-compose.override.yml" EXIT
            # Basis-image vooraf ophalen met ruime retry. De build resolvet python:3.12-slim
            # bij Docker Hub; een korte Hub-storing (TLS-handshake-timeout) liet de hele
            # deploy anders al in de build-stap afbreken (okt 2026). Slaagt deze pull, dan is
            # Hub op dat moment bereikbaar en slaagt de image-resolve in de build ook; en het
            # image staat dan sowieso lokaal warm. Backoff 30/60/90/120/150s (~7,5 min).
            p=0
            until docker pull python:3.12-slim; do
              p=$((p+1))
              if [ "$p" -ge 6 ]; then echo "python:3.12-slim pull bleef falen na $p pogingen (Docker Hub onbereikbaar?)." >&2; exit 1; fi
              wacht=$((p*30))
              echo "Pull-poging $p mislukt; ${wacht}s wachten en opnieuw..." >&2
              sleep "$wacht"
            done
            n=0
            until docker compose -f docker-compose.yml -f docker-compose.override.yml build fundazoeker kansen beschikbaarheid-check vergunningen-index; do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then echo "Build bleef falen na $n pogingen." >&2; exit 1; fi
              wacht=$((n*20))
              echo "Build-poging $n mislukt; ${wacht}s wachten en opnieuw..." >&2
              sleep "$wacht"
            done
            docker compose up -d fundazoeker kansen beschikbaarheid-check vergunningen-index
          '

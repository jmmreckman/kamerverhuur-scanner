name: Deploy naar VPS

on:
  push:
    branches:
      - claude/rotterdam-property-scraper-impfg0
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -euo pipefail
            cd /opt/kamerverhuur-scanner/deploy
            # De fundazoeker/kansen-images bouwen vanaf een remote git-context; GitHub
            # rate-limit onauthenticated downloads soms kort ("please retry later"). Daarom
            # de build een paar keer opnieuw proberen met backoff i.p.v. meteen falen.
            n=0
            until docker compose build --no-cache fundazoeker kansen beschikbaarheid-check vergunningen-index; do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then echo "Build bleef falen na $n pogingen." >&2; exit 1; fi
              echo "Build-poging $n mislukt (mogelijk tijdelijke GitHub-rate-limit); 30s wachten en opnieuw..." >&2
              sleep 30
            done
            docker compose up -d fundazoeker kansen beschikbaarheid-check vergunningen-index
          '

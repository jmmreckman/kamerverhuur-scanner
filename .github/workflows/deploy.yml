name: Deploy naar VPS

on:
  push:
    branches:
      - claude/student-housing-rent-tracker-u2fb2f
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -euo pipefail
            cd /opt/kamerverhuur-scanner
            git fetch origin claude/student-housing-rent-tracker-u2fb2f
            git checkout claude/student-housing-rent-tracker-u2fb2f
            git reset --hard origin/claude/student-housing-rent-tracker-u2fb2f
            cd deploy
            # Alleen de steenhub-services (webapp + bijbehorende cron-containers)
            # bouwen en herstarten - NIET alle apps tegelijk. "up -d --build" zonder
            # service-lijst herbouwde voorheen elke app (gewicht, kansen, scanners,
            # caddy) parallel, wat het geheugen op de 2 GB-VPS opvrat en de server
            # platlegde. Met cache (geen --no-cache) zijn dit lichte builds.
            docker compose build app dagelijkse-check winst-snapshot
            docker compose up -d app dagelijkse-check winst-snapshot
          '

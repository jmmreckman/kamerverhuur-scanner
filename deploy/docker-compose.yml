# Eén website die meerdere panden bedient (dropdown/toegang per gebruiker),
# achter Caddy als reverse-proxy (die ook automatisch gratis HTTPS regelt).
#
# Nieuw pand toevoegen: een blok toevoegen aan properties.json - geen nieuwe
# container of nieuw domein nodig, het is dezelfde site.

services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - ./app.env
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  # Draait elk uur (op het hele uur, Europe/Amsterdam) automatisch dezelfde
  # betaalcontrole als de "Nu controleren"-knop, voor alle panden. Zelfde
  # image als 'app', alleen een ander opstartcommando - geen losse cron-
  # daemon nodig. Zie scripts/dagelijkse_controle.py (naam is historisch).
  dagelijkse-check:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - ./app.env
    volumes:
      - ./data:/app/data
    command: ["python3", "-m", "scripts.dagelijkse_controle"]

  # Los, ander project (gewicht-tracker, https://gewicht.steenhub.nl) dat
  # meelift op dezelfde VPS/Caddy - geen relatie met de kamerverhuur-app
  # verder dan gedeelde hosting. Code + Dockerfile staan op een aparte
  # branch in deze repo; Docker bouwt rechtstreeks vanaf die branch als
  # git-context (geen lokale checkout nodig). WEIGHT_APP_USERNAME/
  # WEIGHT_APP_PASSWORD in weight-tracker.env (kopieer van
  # weight-tracker.env.example, zelfde patroon als app.env) - zonder die
  # twee draait de app zonder login.
  weight-tracker:
    build:
      context: https://github.com/jmmreckman/kamerverhuur-scanner.git#claude/weight-tracking-portal-x3phgn
    container_name: weight-tracker
    restart: unless-stopped
    env_file:
      - ./weight-tracker.env
    environment:
      - WEIGHT_DB_PATH=/data/weight.db
    volumes:
      - weight-tracker-data:/data
    expose:
      - "8420"

  # Los, derde project (fundazoeker) dat meelift op dezelfde VPS - geen
  # relatie met de andere twee projecten verder dan gedeelde hosting. Geen
  # webinterface: draait zelf elke dag om 09:00 (Europe/Amsterdam) een scan
  # naar geschikte Rotterdamse kamerverhuur-panden en mailt een rapport -
  # dus geen expose/Caddy-blok/subdomein nodig, in tegenstelling tot de
  # andere twee projecten. Code + Dockerfile staan op een aparte branch in
  # deze repo; Docker bouwt rechtstreeks vanaf die branch als git-context.
  # SCANNER_GMAIL_ADDRESS/SCANNER_GMAIL_APP_PASSWORD (en evt.
  # REPORT_TO_ADDRESS/SMTP_*) in fundazoeker.env (kopieer van
  # fundazoeker.env.example) - zonder de Gmail-gegevens start de container
  # niet.
  fundazoeker:
    build:
      context: https://github.com/jmmreckman/kamerverhuur-scanner.git#claude/rotterdam-property-scraper-impfg0
    container_name: fundazoeker
    restart: unless-stopped
    env_file:
      - ./fundazoeker.env
    volumes:
      - fundazoeker-data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - weight-tracker

volumes:
  caddy_data:
  caddy_config:
  weight-tracker-data:
  fundazoeker-data:

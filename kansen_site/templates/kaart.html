<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kansen - Rotterdamse kamerverhuur</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='kaart.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>Kansen</h1>
    <div class="topbar-acties">
      <span id="status-tekst" class="muted"></span>
      <button id="ververs-knop" type="button">Ververs nu</button>
      <button id="bekendmakingen-knop" type="button" class="link-knop" title="Check nu of er nieuwe kamerverhuurvergunningen (officiële bekendmakingen) binnen 50 m van je favorieten zijn afgegeven">Vergunningen checken</button>
      <button id="zijbalk-knop" type="button" class="link-knop">Toon lijst</button>
      <a href="{{ url_for('data_analyse') }}" class="link-knop">Data-analyse</a>
      <a href="{{ url_for('handmatig_toevoegen') }}" class="link-knop">Toevoegen</a>
      <a href="{{ url_for('verwijderd') }}" class="link-knop">Verwijderd</a>
      <span class="muted">{{ gebruiker }}</span>
      <form method="post" action="{{ url_for('logout') }}"><button type="submit" class="link-knop">Uitloggen</button></form>
    </div>
  </header>

  <div class="layout">
    <aside id="zijbalk" class="zijbalk">
      <button id="zijbalk-sluiten-knop" type="button" class="link-knop zijbalk-sluiten">&larr; Terug naar kaart</button>
      <div class="filters">
        <label class="checkbox-filter"><input type="checkbox" id="toon-kansen" checked> Toon kansen</label>
        <label class="checkbox-filter"><input type="checkbox" id="toon-vergunningen"> Toon vergunningen (4+ bewoners)</label>
        <label class="checkbox-filter checkbox-sub"><input type="checkbox" id="toon-3kamer"> ook 3-kamer vergunningen</label>
        <span id="vergunningen-status" class="muted"></span>
        <label>Stad
          <select id="filter-stad">
            <option value="">Alle steden</option>
            <option value="rotterdam">Rotterdam</option>
            <option value="den_haag">Den Haag</option>
          </select>
        </label>
        <label>Wijk
          <select id="filter-wijk"><option value="">Alle wijken</option></select>
        </label>
        <label>Aantal investeerders
          <select id="filter-investeerders">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
          </select>
        </label>
        <label>Max. eigen inleg p.p. (ná verhoging)
          <input type="number" id="filter-eigen-inleg" placeholder="bv. 30000">
        </label>
        <label>Max. schakelgeld p.p. (vóór verhoging)
          <input type="number" id="filter-schakelgeld" placeholder="bv. 90000">
        </label>
        <label>Min. winst p.p./mnd
          <input type="number" id="filter-winst" placeholder="bv. 100">
        </label>
        <label>Zoek adres
          <input type="text" id="filter-zoek" placeholder="straatnaam...">
        </label>
        <label>Max. dagen op Funda
          <input type="number" id="filter-dagen" min="0" step="1" placeholder="bv. 3">
        </label>
        <label>Sorteer op (laagste bovenaan)
          <select id="filter-sorteer">
            <option value="inleg" selected>Eigen inleg p.p. (ná verhoging)</option>
            <option value="schakelgeld">Schakelgeld p.p. (vóór verhoging)</option>
            <option value="winst">Winst p.p./mnd</option>
            <option value="datum">Datum (eerst gezien)</option>
          </select>
        </label>
      </div>
      <p id="aantal-tekst" class="muted"></p>
      <ul id="lijst" class="lijst"></ul>
    </aside>
    <main id="kaart" class="kaart"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="{{ url_for('static', filename='kaart.js') }}"></script>
</body>
</html>

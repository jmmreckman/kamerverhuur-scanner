<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gewicht Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Gewicht Tracker</h1>

    <section class="entry-card">
      <form id="weight-form">
        <label>
          Datum
          <input type="date" id="entry-date" required>
        </label>
        <label>
          Gewicht (kg)
          <input type="number" id="entry-weight" step="0.1" min="1" max="400" required>
        </label>
        <button type="submit">Opslaan</button>
      </form>
      <p id="save-status" class="status"></p>
    </section>

    <section class="buttons">
      <button data-view="all">Totaalgrafiek 2013-nu</button>
      <button data-view="yearly">Per kalenderjaar</button>
      <button data-view="compare">Vergelijk vandaag</button>
      <button data-view="averages">Gemiddeldes</button>
    </section>

    <section id="view-all" class="view hidden">
      <div class="range-buttons" id="range-buttons">
        <button data-range="7">7 dagen</button>
        <button data-range="14">2 weken</button>
        <button data-range="30">1 maand</button>
        <button data-range="90">3 maanden</button>
        <button data-range="365">1 jaar</button>
        <button data-range="1825">5 jaar</button>
        <button data-range="all">All-time</button>
      </div>
      <div class="chart-tall"><canvas id="chart-all"></canvas></div>
    </section>

    <section id="view-yearly" class="view hidden">
      <div class="chart-tall"><canvas id="chart-yearly"></canvas></div>
    </section>

    <section id="view-compare" class="view hidden">
      <h2 id="compare-heading"></h2>
      <p id="compare-streak"></p>
      <table id="compare-table">
        <thead>
          <tr><th>Jaar</th><th>Datum</th><th>Gewicht</th><th>Verschil</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="view-averages" class="view hidden">
      <table id="averages-table">
        <thead>
          <tr><th>Periode</th><th>Gemiddelde</th><th>Verschil t.o.v. nu</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/static/chart.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

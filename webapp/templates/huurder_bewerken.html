{% extends "base.html" %}
{% block title %}{% if kamer %}Kamer {{ kamer.kamer }} bewerken{% else %}Nieuwe kamer{% endif %}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{% if kamer %}Kamer {{ kamer.kamer }} bewerken{% else %}Nieuwe kamer toevoegen{% endif %}</h1>
</div>

<div class="card">
  <form method="post" action="{% if kamer %}{{ url_for('huurder_bewerken', pand_slug=huidig_pand.slug, kamer_naam=kamer.kamer) }}{% else %}{{ url_for('huurder_nieuw', pand_slug=huidig_pand.slug) }}{% endif %}">
    <label>Kamer
      <input type="text" name="kamer" value="{{ kamer.kamer if kamer else '' }}" required>
    </label>
    <label>Naam huurder (leeg = kamer staat leeg)
      <input type="text" name="naam" value="{{ kamer.naam if kamer else '' }}">
    </label>
    <label>Mail
      <input type="email" name="email" value="{{ kamer.email or '' if kamer else '' }}">
    </label>
    <label>Telefoonnummer
      <input type="tel" name="telefoonnummer" value="{{ kamer.telefoonnummer or '' if kamer else '' }}">
    </label>
    <label>Kale huurprijs per maand (EUR, optioneel)
      <input type="text" name="kale_huurprijs" value="{{ kamer.kale_huurprijs|eur if kamer and kamer.kale_huurprijs is not none else '' }}">
    </label>
    <label>Servicekosten per maand (EUR, optioneel)
      <input type="text" name="servicekosten" value="{{ kamer.servicekosten|eur if kamer and kamer.servicekosten is not none else '' }}">
    </label>
    <label>Totale huur per maand (EUR) - dit bedrag moet via bunq binnenkomen
      <input type="text" name="verwacht_bedrag" value="{{ kamer.verwacht_bedrag|eur if kamer else '' }}" required>
    </label>
    <label>Contract einddatum (of bijv. "onbepaalde tijd")
      <input type="text" name="contract_einddatum" value="{{ kamer.contract_einddatum or '' if kamer else '' }}">
    </label>
    <label>Opmerking
      <input type="text" name="opmerking" value="{{ kamer.opmerking or '' if kamer else '' }}">
    </label>
    <label>IBAN (optioneel, meest betrouwbare matching)
      <input type="text" name="iban" value="{{ kamer.iban or '' if kamer else '' }}">
    </label>
    <label>Zoekwoord (optioneel, gebruikt als er geen IBAN is)
      <input type="text" name="zoekwoord" value="{{ kamer.zoekwoord or '' if kamer else '' }}">
    </label>
    <button class="btn" type="submit">Opslaan</button>
    <a class="btn btn-secondary" href="{{ url_for('huurders', pand_slug=huidig_pand.slug) }}">Annuleren</a>
  </form>
</div>
{% endblock %}

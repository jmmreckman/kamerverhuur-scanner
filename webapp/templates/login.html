{% extends "base.html" %}
{% from "_icons.html" import icon_baksteen %}
{% block title %}Inloggen - Steenhub{% endblock %}
{% block content %}
<div class="login-page">
  <div style="display:flex; flex-direction:column; align-items:center; gap:0.6rem; margin-bottom:1.5rem;">
    <span class="logo-mark" style="width:48px; height:48px;">{{ icon_baksteen() }}</span>
    <strong>Steenhub</strong>
  </div>
  <div class="card">
    <form method="post">
      <label>Gebruikersnaam
        <input type="text" name="username" autofocus required>
      </label>
      <label>Wachtwoord
        <input type="password" name="password" required>
      </label>
      <button class="btn" type="submit" style="width:100%; justify-content:center;">Inloggen</button>
    </form>
  </div>
</div>
{% endblock %}
